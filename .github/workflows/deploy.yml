name: Deploy ARPL EHS PTW to Firebase (asia-south1)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    name: Build & Deploy Serverless Stack
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set Up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Install Cloud Functions Dependencies
        working-directory: ./functions
        run: npm install

      - name: 4. Authenticate to Google Cloud (Keyless Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1045760890879/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'sa-github-deployer@prj-aurorealty-ehs-ptw-dev.iam.gserviceaccount.com'

      - name: 4b. Synchronize Canonical Assets to Public
        run: node scripts/sync_public.js

      - name: 5. Inject Firebase Secrets into Client Configuration
        run: |
          echo "Injecting Firebase Secrets from GitHub Secrets into client configuration..."
          if [ -n "${{ secrets.FIREBASE_API_KEY }}" ]; then
            sed -i "s|__FIREBASE_API_KEY__|${{ secrets.FIREBASE_API_KEY }}|g" public/firebase-config.js
            sed -i "s|__FIREBASE_API_KEY__|${{ secrets.FIREBASE_API_KEY }}|g" firebase-config.js 2>/dev/null || true
            sed -i "s|__FIREBASE_API_KEY__|${{ secrets.FIREBASE_API_KEY }}|g" public/index.html 2>/dev/null || true
            sed -i "s|__FIREBASE_API_KEY__|${{ secrets.FIREBASE_API_KEY }}|g" index.html 2>/dev/null || true
            echo "FIREBASE_API_KEY injected successfully."
          else
            echo "Warning: FIREBASE_API_KEY is not set in GitHub repository secrets."
          fi
          if [ -n "${{ secrets.FIREBASE_APP_ID }}" ]; then
            sed -i "s|__FIREBASE_APP_ID__|${{ secrets.FIREBASE_APP_ID }}|g" public/firebase-config.js
            sed -i "s|__FIREBASE_APP_ID__|${{ secrets.FIREBASE_APP_ID }}|g" firebase-config.js 2>/dev/null || true
          fi
          if [ -n "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" ]; then
            sed -i "s|__FIREBASE_MESSAGING_SENDER_ID__|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" public/firebase-config.js
            sed -i "s|__FIREBASE_MESSAGING_SENDER_ID__|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" firebase-config.js 2>/dev/null || true
          fi

      - name: 6. Install Firebase CLI & Deploy Full Stack
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          npm install -g firebase-tools
          echo "Deploying Firestore rules, composite indexes, Storage rules & Hosting..."
          firebase deploy --project prj-aurorealty-ehs-ptw-dev --only firestore,storage,hosting --non-interactive --force
          echo "Deploying Cloud Functions..."
          firebase deploy --project prj-aurorealty-ehs-ptw-dev --only functions --non-interactive --force || true
